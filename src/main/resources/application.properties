spring.application.name=demo

# Settings shared by every environment. Database connections live in the
# profile files beside this one:
#   application-local.properties  the default; a PostgreSQL started from compose.yaml
#   application-prod.properties   the hosted database, credentials from DB_* env vars
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
