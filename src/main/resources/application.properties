spring.application.name=demo

# Settings shared by every environment. Database connections live in the
# profile files beside this one:
#   application-local.properties  the default; a PostgreSQL started from compose.yaml
#   application-prod.properties   the hosted database, credentials from DB_* env vars
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Login is Clerk's (see SecurityConfig and ClerkJwtConfig). Neither value is
# secret; the backend never needs Clerk's secret key.
#   CLERK_ISSUER              the instance's Frontend API URL, e.g. https://xyz.clerk.accounts.dev
#                             (Clerk dashboard > Configure > API keys)
#   CLERK_AUTHORIZED_PARTIES  comma-separated origins allowed to hold tokens, e.g.
#                             http://localhost:5173 locally, the CloudFront URL in prod
# Both are strict placeholders: if either is missing, startup fails with
# "Could not resolve placeholder" rather than running with no login.
app.auth.issuer=${CLERK_ISSUER}
app.auth.authorized-parties=${CLERK_AUTHORIZED_PARTIES}
