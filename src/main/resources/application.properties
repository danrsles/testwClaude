spring.application.name=demo

# Database credentials are deliberately NOT stored here, since this file is
# committed. Supply them in ./application-local.properties (git-ignored, see
# application-local.properties.example) or via the environment variables named
# below. Startup fails if neither provides a value.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
