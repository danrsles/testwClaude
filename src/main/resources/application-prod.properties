# The hosted database. Activated with SPRING_PROFILES_ACTIVE=prod.
#
# No values here: they arrive as environment variables on the server, and
# startup fails if any is missing. DB_URL is a whole JDBC URL so it can carry
# TLS settings, e.g. for Aiven:
#   jdbc:postgresql://<host>:<port>/defaultdb?sslmode=verify-full&sslrootcert=/certs/ca.pem
#
# To run against this database from a laptop instead, put the three
# spring.datasource values in config/application-prod.properties (git-ignored;
# see config/application-prod.properties.example). Spring reads ./config/
# automatically and it overrides this file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Never try to start compose.yaml in production. The dependency is left out of
# the packaged jar anyway; this covers running the prod profile from a checkout.
spring.docker.compose.enabled=false
