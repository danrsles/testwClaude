# The hosted database. Activated with SPRING_PROFILES_ACTIVE=prod.
#
# No values here: they arrive as environment variables on the server, and
# startup fails if any is missing. DB_URL is a whole JDBC URL so it can carry
# TLS settings, e.g. for Aiven:
#   jdbc:postgresql://<host>:<port>/defaultdb?sslmode=verify-full&sslrootcert=/certs/ca.pem
#
# To run against this database from a laptop instead, put the three
# spring.datasource values in config/application-prod.properties (git-ignored;
# see config/application-prod.properties.example). Spring reads ./config/
# automatically and it overrides this file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hikari holds 10 connections open by default. The hosted free plan allows 20 in
# total, a few of them reserved for superusers, so the deployed server plus a
# laptop run of this profile at 10 each would be refused ("remaining connection
# slots are reserved..."). Each query borrows a connection for milliseconds, so
# this app needs few.
spring.datasource.hikari.maximum-pool-size=7

# Only requests carrying ORIGIN_SECRET in X-Origin-Secret are served (see
# OriginSecretFilter); CloudFront adds it. The check fails closed: a missing
# ORIGIN_SECRET fails startup with "Could not resolve placeholder", and an empty
# one with "app.origin-secret is blank". To run this profile from a laptop,
# where requests come from the Vite proxy without the header, set
# app.origin-check.enabled=false in config/application-prod.properties.
app.origin-check.enabled=true
app.origin-secret=${ORIGIN_SECRET}

# Never try to start compose.yaml in production. The dependency is left out of
# the packaged jar anyway; this covers running the prod profile from a checkout.
spring.docker.compose.enabled=false
