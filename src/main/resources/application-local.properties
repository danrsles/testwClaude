# Local development, the default profile. No datasource settings: Spring Boot's
# Docker Compose support starts the postgres service in compose.yaml and
# connects to it with the credentials declared there.
#
# start-only leaves the container running when the app stops, so the data stays
# reachable from a database client between runs. Stop it with docker compose stop.
spring.docker.compose.lifecycle-management=start-only

# The Vite dev server's origin, which is what Clerk puts in the token's azp.
app.auth.authorized-parties=http://localhost:5173
# The Clerk development instance (its Frontend API URL). Not secret, so it is
# committed rather than exported as CLERK_ISSUER in every shell. It is also the
# host encoded in the frontend's pk_test_ publishable key.
app.auth.issuer=https://enabled-walleye-998.clerk.accounts.dev
