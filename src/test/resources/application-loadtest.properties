# Only for LoadTestApplication (mvn spring-boot:test-run), layered over the
# local profile.

# The same pool as the prod profile, so the load test queues for connections
# where the deployed API would. Override it to compare, e.g.
#   mvn spring-boot:test-run -Dspring-boot.run.arguments=--spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.maximum-pool-size=7

# Its own port, so it can run beside a normal mvn spring-boot:run on 8080.
server.port=8081

# Rate limits on, as deployed. The test classpath's config/application.properties
# turns them off for the tests, and this profile file outranks it. feed.js
# (one GET a second per user) and race.js (one POST per user) stay under them;
# ratelimit.js is the scenario that runs into them.
app.rate-limit.enabled=true
