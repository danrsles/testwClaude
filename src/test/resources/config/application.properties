# Test-only settings, layered over src/main/resources/application.properties:
# Spring reads classpath:/config/ after the classpath root, and only the test
# classpath has this folder.

# The database tests call WantService.expireDue themselves; a scheduled run
# in between would close their wants first and make them flaky.
app.expiry.enabled=false

# Lets WantFeedQueriesIT count the statements one feed takes. It only counts;
# it changes no query.
spring.jpa.properties.hibernate.generate_statistics=true
