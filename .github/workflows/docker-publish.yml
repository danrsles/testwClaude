name: Build and publish Docker image

# Runs on every commit to master. workflow_dispatch allows a manual run
# from the Actions tab, which is useful for testing this before merging.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: danrsles/wants-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No database service is needed: the tests are @WebMvcTest slices
      # and never open a datasource.
      - name: Run tests
        run: mvn -B test

  publish:
    name: Publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository
      # secrets. The token is a Docker Hub access token, not the password.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags every build with the commit sha so any image can be traced
      # back to the code that produced it, plus latest for convenience.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
