# The local development database. Spring Boot starts it on mvn spring-boot:run
# (the default local profile) and connects with the credentials below.
#
# They are committed on purpose: this container is a throwaway that listens on
# your machine only and holds sample data. Real credentials never go here.
services:
  postgres:
    # PostGIS on PostgreSQL 18, matching the hosted Aiven database's major
    # version and its extensions (postgis, btree_gist).
    image: postgis/postgis:18-3.6
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wants
      POSTGRES_USER: wants
      POSTGRES_PASSWORD: wants
    ports:
      # 5433 avoids clashing with a locally installed PostgreSQL on 5432. Spring
      # finds the port itself; it is fixed only so a database client can connect.
      - "5433:5432"
    labels:
      # Spring Boot recognises the official postgres image by name, not
      # postgis/postgis, so the label tells it which connection to build.
      org.springframework.boot.service-connection: postgres
    # PostgreSQL 18 images keep data in a versioned directory under
    # /var/lib/postgresql, so the volume mounts there rather than at .../data.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wants -d wants"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
